[package]
name = "spacetime-module"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
spacetimedb = "=2.3.0"
log = "0.4"
# PIN hashing — pure-Rust, wasm32-safe (bcrypt/ring do NOT build for wasm32).
sha2 = "0.10"
hex = "0.4"
